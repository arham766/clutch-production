[project]
name = "fixalong-ingest"
version = "0.1.0"
description = "Unsiloed -> Moss manual ingestion pipeline for the Fixalong repair copilot"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "moss>=1.1.1",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "fact-protocol",
]

[tool.uv.sources]
fact-protocol = { path = "../fact", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "responses>=0.25.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "live: integration tests that hit the real Unsiloed/Moss APIs (need credentials; skipped by default)",
]

[tool.uv]
package = false
